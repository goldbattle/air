[versions]
agp = "9.0.1"
kotlin = "2.1.20"
coreKtx = "1.18.0"
composeBom = "2025.10.01"
activityCompose = "1.10.1"
work = "2.10.5"
mlkitText = "16.0.1"
glance = "1.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Frozen at 1.7.x, no longer in the BOM
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version = "1.7.8" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-work = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
# On-device OCR with the model bundled in the APK (no model download).
mlkit-text = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitText" }
# Home screen widget in Compose style
androidx-glance = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
junit = { group = "junit", name = "junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
