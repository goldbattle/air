name: Release

# Every push to main is built and tested. If app/version.properties holds a version that has no release yet,
# the signed APK is published as GitHub Release v1.0.<versionCode>, which the app's updater picks up.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_test_and_release:
    name: Build, test and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(sed -n 's/^versionCode=//p' app/version.properties | tr -d '[:space:]')
          tag="v1.0.$code"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released; building and testing only."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Releases must always be signed with the same key, or installed copies can't update.
      - name: Decode signing key
        if: steps.version.outputs.release == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The SIGNING_KEY secret is missing; refusing to publish a debug-signed release."
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "AIR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        env:
          AIR_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          AIR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AIR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease testDebugUnitTest

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          apk="air-${TAG#v}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          prev=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          {
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              echo
              git log --no-merges --pretty='- %s' "$prev..HEAD"
            else
              echo "First release."
            fi
            echo
            echo "SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
          } > notes.md
          gh release create "$TAG" "$apk" --title "Air ${TAG#v}" --notes-file notes.md --target "$GITHUB_SHA"
